<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- La tienda NO sale en Google (así las fotos de las personas no se indexan): deja esta línea siempre. Mientras no la enlaces desde el menú de la web, además queda oculta; para abrirla al público basta con enlazarla en el menú (dímelo y lo hago). -->
<meta name="robots" content="noindex, follow">
<title>Tu pedido · Alex Suárez</title>
<meta name="theme-color" content="#0e1113">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e1113'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='20' text-anchor='middle' fill='%23ece8e1'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/albert-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tienda.css">
<script>
/* Elige el idioma antes de pintar: ?lang=es|en, si no el que eligió el visitante en la web, si no el del navegador */
(function () {
  var l = (location.search.match(/[?&]lang=(es|en)\b/) || [])[1], s = null;
  try { s = localStorage.getItem('idioma'); } catch (e) {}
  if (!l) l = (s === 'es' || s === 'en') ? s : (/^en\b/i.test(navigator.language || '') ? 'en' : 'es');
  document.documentElement.lang = l;
})();
</script>
<!-- Estadísticas de visitas: Umami Cloud (sin cookies). Solo cuenta en alexsuarez.es, no en pruebas locales. -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="496132da-e026-4dab-b417-7681883feb89" data-domains="alexsuarez.es,www.alexsuarez.es"></script>
</head>
<body data-page="pedido">

<header class="shop-top">
  <div class="wrap bar">
    <a class="brand" href="index.html" aria-label="Alex Suárez, volver a la web" data-en-aria-label="Alex Suárez, back to the site">Alex Suárez</a>
    <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es" lang="es" aria-pressed="true" title="Español">ES</button><button type="button" data-lang="en" lang="en" aria-pressed="false" title="English">EN</button></div>
    <a class="btn solid cart-btn" id="cart-btn" href="pedido.html" aria-label="Carrito" data-en-aria-label="Cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8zM9 8V7a3 3 0 0 1 6 0v1"/></svg><span class="txt" data-en="Cart">Carrito</span><span class="n" id="cart-n" hidden></span></a>
  </div>
</header>

<main class="wrap" id="main">
  <p class="notice demo" id="demo-note" role="note" hidden></p>
  <div id="view-empty" hidden></div>

  <div class="order" id="view-order" hidden>
    <section aria-labelledby="o-title">
      <h1 id="o-title"></h1>
      <div id="order-groups" style="margin-top: 28px"></div>
    </section>

    <aside>
      <div class="card">
        <h2 id="o-sum-title"></h2>
        <ul class="lines" id="lines" style="margin-top: 16px"></ul>
        <div class="total"><span id="total-lbl"></span><b id="total-val"></b></div>
        <p class="hint" id="tier-hint" hidden></p>
      </div>

      <div class="card"><ul class="facts" id="facts"></ul></div>

      <form class="card form" id="order-form" novalidate>
        <h2 data-en="Your details">Tus datos</h2>
        <div class="f-field"><label for="f-name" data-en="Name">Nombre</label><input id="f-name" type="text" autocomplete="name" required maxlength="80" placeholder="Cómo te llamas" data-en-placeholder="Your name"></div>
        <div class="f-field"><label for="f-email" data-en="Email (where I will send the photos)">Correo (donde te envío las fotos)</label><input id="f-email" type="email" autocomplete="email" required maxlength="120" inputmode="email" placeholder="nombre@correo.com" data-en-placeholder="name@email.com"></div>
        <div class="f-field"><label for="f-email2" data-en="Repeat your email">Repite tu correo</label><input id="f-email2" type="email" autocomplete="off" required maxlength="120" inputmode="email" placeholder="nombre@correo.com" data-en-placeholder="name@email.com"></div>
        <div class="f-hp" aria-hidden="true"><label>No rellenes esto <input id="f-hp" type="text" tabindex="-1" autocomplete="off"></label></div>
        <label class="check"><input id="f-terms" type="checkbox"><span data-en='I have read and accept the <a href="legal.html#condiciones" target="_blank" rel="noopener">terms of sale</a> and the <a href="legal.html#privacidad" target="_blank" rel="noopener">privacy policy</a>.'>He leído y acepto las <a href="legal.html#condiciones" target="_blank" rel="noopener">condiciones de venta</a> y la <a href="legal.html#privacidad" target="_blank" rel="noopener">política de privacidad</a>.</span></label>
        <label class="check"><input id="f-digital" type="checkbox"><span data-en="I expressly ask you to send me the photos as soon as the payment is confirmed, and I understand that, once they are delivered, I lose my right of withdrawal.">Solicito expresamente que me envíes las fotos en cuanto se confirme el pago y entiendo que, una vez entregadas, pierdo mi derecho de desistimiento.</span></label>
        <div class="pay-row">
          <button class="btn pay" id="pay" type="submit"></button>
          <p class="small" id="pay-small"></p>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </aside>
  </div>

  <div id="view-done" hidden></div>
  <noscript><p class="notice"><span class="es">Esta página necesita JavaScript para mostrar el carrito.</span><span class="en">This page needs JavaScript to show the cart.</span></p></noscript>
</main>

<footer>
  <div class="wrap">
    <span class="mono">Alex Suárez · A Coruña</span>
    <span class="foot-legal"><a class="mono" href="legal.html#aviso-legal" data-en="Legal notice">Aviso legal</a><a class="mono" href="legal.html#privacidad" data-en="Privacy">Privacidad</a><a class="mono" href="legal.html#condiciones" data-en="Terms of sale">Condiciones de venta</a><a class="mono" href="legal.html#cookies" data-en="Cookies">Cookies</a></span>
    <span class="mono">© 2026</span>
  </div>
</footer>

<script src="tienda.js"></script>
</body>
</html>
