<script>
/* Elige el idioma antes de pintar: ?lang=es|en, si no el que eligió el visitante en la web, si no el del navegador */
(function () {
  var l = (location.search.match(/[?&]lang=(es|en)\b/) || [])[1], s = null;
  try { s = localStorage.getItem('idioma'); } catch (e) {}
  if (!l) l = (s === 'es' || s === 'en') ? s : (/^en\b/i.test(navigator.language || '') ? 'en' : 'es');
  document.documentElement.lang = l;
})();
</script>
<!-- Estadísticas de visitas: Umami Cloud (sin cookies). Solo cuenta en alexsuarez.es, no en pruebas locales. -->
