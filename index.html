<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu Nombre · Foto y vídeo</title>
<meta name="description" content="Portfolio de foto y vídeo de Tu Nombre.">
<!-- Esta línea evita que Google indexe la página: solo entra quien tenga tu enlace.
     Bórrala el día que quieras salir en los buscadores. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">

<!-- Vista previa al compartir el enlace (Instagram, WhatsApp...).
     Cambia la dirección por la tuya. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Tu Nombre · Foto y vídeo">
<meta property="og:description" content="Portfolio de foto y vídeo de Tu Nombre.">
<meta property="og:image" content="https://alexsuarezfoto.github.io/images/social.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">

<style>
/* Negro carbón con un solo naranja. Titulares en sans pesada con una palabra en serif cursiva.
   Hero redondeado con vídeo, banda de texto, trabajos en rejilla, fotos en carrusel, panel naranja de contacto. */
:root {
  --bg: #111111;
  --panel: #191919;
  --card: #1f1f1f;
  --line: #2b2b2b;
  --ink: #f3efe9;
  --muted: #9b968e;
  --accent: #ff5a1f;
  --accent-deep: #d63a0a;
  --on-accent: #151210;
  --sans: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  /* Pon "none" para que las tres fotos de la sección intro salgan a color */
  --filtro-intro: grayscale(1) contrast(1.05);
  --radio: 26px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
img, video { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: 0; }
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding-inline: max(18px, env(safe-area-inset-left, 0px)) max(18px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-weight: 600; font-size: 15px; color: var(--accent); margin: 0; }
.eyebrow.serif { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 26px; color: var(--ink); }
.muted { color: var(--muted); }
h2 { font-weight: 800; font-size: clamp(32px, 5.4vw, 68px); line-height: 1; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
h2 em { font-size: 1.12em; letter-spacing: -.01em; }

/* Botones en forma de píldora */
.pill { display: inline-flex; align-items: center; gap: 12px; padding: 6px 6px 6px 20px; border-radius: 999px; background: var(--ink); color: var(--on-accent); font-weight: 600; font-size: 14px; text-decoration: none; transition: transform .2s; white-space: nowrap; }
.pill i { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-style: normal; font-size: 15px; transition: transform .2s; }
.pill:hover i { transform: translateX(3px); }
.pill.orange { background: var(--accent); color: #fff; }
.pill.orange i { background: var(--ink); color: var(--on-accent); }
.pill.dark { background: var(--on-accent); color: var(--ink); }
.pill.dark i { background: var(--ink); color: var(--on-accent); }

/* Cabecera */
.site-header { position: sticky; top: 0; z-index: 30; background: rgba(17,17,17,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding-top: env(safe-area-inset-top, 0px); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 68px; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -.02em; text-decoration: none; white-space: nowrap; }
.menu { display: flex; gap: 28px; }
.menu a { font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; transition: color .2s; }
.menu a:hover { color: var(--ink); }

/* Hero */
.hero { position: relative; border-radius: var(--radio); overflow: hidden; height: clamp(580px, 90svh, 780px); background: var(--accent-deep); isolation: isolate; }
.hero video { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; }
.hero-shade { position: absolute; inset: 0; z-index: -1; background:
  linear-gradient(135deg, rgba(255,90,31,.5), rgba(255,90,31,0) 55%),
  linear-gradient(to top, rgba(17,17,17,.85) 0%, rgba(17,17,17,0) 55%); }
.hero-body { height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(24px, 4vw, 52px); }
.hero-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); align-items: center; gap: 24px 48px; flex: 1; }
.hero-title { min-width: 0; }
.hi { margin: 0 0 6px; font-weight: 500; font-size: clamp(18px, 2vw, 24px); }
h1 { margin: 0; font-weight: 800; font-size: clamp(48px, 7.6vw, 108px); line-height: .92; letter-spacing: -.04em; overflow-wrap: anywhere; }
h1 span { display: block; }
h1 em { display: block; font-size: 1.08em; letter-spacing: -.01em; line-height: .95; }
.hero-side { min-width: 0; align-self: end; }
.hero-lead { margin: 0; font-weight: 700; font-size: clamp(20px, 2.2vw, 26px); line-height: 1.2; letter-spacing: -.01em; }
.hero-sub { margin: 14px 0 0; font-size: 14px; color: rgba(243,239,233,.75); }
.specs { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 24px; }
.specs li { font-size: 14px; font-weight: 500; }
.specs b { display: block; font-size: 12px; color: var(--accent); font-weight: 700; }

/* Banda de texto en movimiento */
.marquee { overflow: hidden; border-block: 1px solid var(--line); margin-top: clamp(40px, 6vw, 72px); }
.marquee-track { display: flex; width: max-content; animation: run 38s linear infinite; }
.marquee-track span { display: flex; align-items: center; font-weight: 600; font-size: clamp(22px, 3.2vw, 40px); letter-spacing: -.01em; text-transform: uppercase; padding-block: 22px; white-space: nowrap; }
.marquee-track span::after { content: ""; display: block; width: clamp(40px, 6vw, 90px); height: 1px; background: var(--muted); margin-inline: clamp(20px, 3vw, 44px); }
@keyframes run { to { transform: translateX(-50%); } }

/* Marcas */
.brands { margin-top: 20px; background: var(--panel); border-radius: var(--radio); padding: clamp(20px, 3vw, 32px) clamp(20px, 3.4vw, 40px); display: flex; align-items: center; gap: 20px 48px; flex-wrap: wrap; }
.brands[hidden] { display: none; }
.brands p { margin: 0; font-size: 12px; font-weight: 600; line-height: 1.35; max-width: 140px; }
.brand-list { display: flex; flex: 1; justify-content: space-between; gap: 14px 36px; flex-wrap: wrap; min-width: 0; }
.brand-list span { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand-list span::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); }

/* Intro */
section { padding-block: clamp(64px, 10vw, 128px) 0; }
.intro-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px clamp(32px, 6vw, 96px); align-items: start; }
.intro h2 { margin-top: 14px; }
.intro-text { font-weight: 600; font-size: clamp(18px, 1.9vw, 22px); line-height: 1.4; letter-spacing: -.01em; margin: 0; }
.intro-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 28px; }
.intro-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 20px); margin-top: clamp(36px, 5vw, 60px); }
.intro-cards img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 22px; filter: var(--filtro-intro); background: var(--card); transition: filter .4s; }
.intro-cards img:hover { filter: none; }

/* Trabajos */
.head-center { text-align: center; display: grid; gap: 10px; justify-items: center; margin-bottom: clamp(28px, 4vw, 48px); }
.works { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: clamp(230px, 32vw, 420px); gap: clamp(10px, 1.6vw, 20px); }
.work { grid-column: span 6; position: relative; padding: 0; border: 0; border-radius: 20px; overflow: hidden; background: var(--card); text-align: left; cursor: pointer; }
.work:nth-child(4n+1), .work:nth-child(4n+4) { grid-column: span 7; }
.work:nth-child(4n+2), .work:nth-child(4n+3) { grid-column: span 5; }
.work video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .7s ease; }
.work:hover video { transform: scale(1.04); }
.work::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,10,.78), rgba(10,10,10,0) 55%); }
.work-play { position: absolute; z-index: 2; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; border: 1px solid rgba(243,239,233,.7); display: grid; place-items: center; transition: background .25s, border-color .25s; }
.work-play::before { content: ""; margin-left: 3px; border-left: 12px solid var(--ink); border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
.work:hover .work-play { background: var(--accent); border-color: var(--accent); }
.work-cap { position: absolute; z-index: 2; left: clamp(16px, 2vw, 26px); right: clamp(16px, 2vw, 26px); bottom: clamp(14px, 2vw, 24px); display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.work-cap h3 { margin: 0; font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); letter-spacing: -.02em; line-height: 1.1; }
.work-cap span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(243,239,233,.8); }

/* Fotos (carrusel) */
.row-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.arrows { display: flex; gap: 10px; }
.arrow { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 18px; transition: background .2s, border-color .2s; }
.arrow:hover { background: var(--accent); border-color: var(--accent); }
.track { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; margin-inline: calc(max(18px, env(safe-area-inset-left, 0px)) * -1); padding-inline: max(18px, env(safe-area-inset-left, 0px)); scroll-padding-inline: max(18px, env(safe-area-inset-left, 0px)); }
.track::-webkit-scrollbar { display: none; }
.card { flex: 0 0 clamp(240px, 27vw, 340px); scroll-snap-align: start; padding: 0; border: 0; background: none; text-align: left; cursor: zoom-in; }
.card img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 20px; background: var(--card); transition: transform .5s ease; }
.card-img { overflow: hidden; border-radius: 20px; }
.card:hover img { transform: scale(1.04); }
.card h3 { margin: 14px 0 2px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.card p { margin: 0; font-size: 13px; color: var(--muted); }

/* Sobre mí */
.about-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 32px clamp(32px, 6vw, 96px); align-items: center; background: var(--panel); border-radius: var(--radio); padding: clamp(24px, 5vw, 64px); }
.about h2 { margin: 12px 0 0; }
.about p.body { margin: 22px 0 0; max-width: 54ch; color: #cfcac2; }
.facts { display: flex; gap: 16px 44px; flex-wrap: wrap; margin-top: 32px; padding-top: 26px; border-top: 1px solid var(--line); }
.facts div { min-width: 0; }
.facts b { display: block; font-weight: 800; font-size: 34px; letter-spacing: -.03em; line-height: 1.1; }
.facts span { font-size: 13px; color: var(--muted); }
.portrait { aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: var(--card); }
.portrait img { width: 100%; height: 100%; object-fit: cover; }

/* Contacto */
.contact-card { border-radius: var(--radio); padding: clamp(36px, 7vw, 96px) clamp(20px, 5vw, 64px); text-align: center; color: var(--on-accent); background:
  radial-gradient(90% 120% at 15% 0%, #ff7a3d 0%, transparent 60%),
  linear-gradient(160deg, var(--accent), var(--accent-deep)); }
.contact-card h2 { max-width: 14ch; margin: 0 auto; font-size: clamp(40px, 8vw, 108px); line-height: .94; }
.contact-card p { margin: 22px auto 0; max-width: 42ch; font-weight: 500; }
.contact-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 34px; }
.contact-row .pill { overflow-wrap: anywhere; white-space: normal; }

footer { padding-block: 40px calc(36px + env(safe-area-inset-bottom, 0px)); }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

/* Visor */
.viewer { position: fixed; inset: 0; z-index: 50; background: rgba(8,8,8,.97); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.viewer[hidden] { display: none; }
.stage { width: 100%; max-width: 1280px; height: 100%; max-height: 82vh; display: flex; align-items: center; justify-content: center; min-width: 0; }
.stage img, .stage video { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 6px; background: #000; }
.stage video { width: 100%; }
.v-btn { position: absolute; background: rgba(25,25,25,.8); border: 1px solid var(--line); color: var(--ink); font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 999px; cursor: pointer; }
.v-btn:hover { border-color: var(--accent); }
.v-close { top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); }
.v-prev { left: max(10px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); }
.v-next { right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); }
.v-info { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 13px; color: var(--muted); padding-inline: 16px; }

@media (max-width: 860px) {
  .menu { display: none; }
  .hero { height: auto; min-height: 600px; }
  .hero-top { grid-template-columns: minmax(0, 1fr); align-content: end; }
  .hero-side { align-self: start; }
  h1 { font-size: clamp(44px, 14vw, 88px); }
  .brands { flex-direction: column; align-items: flex-start; }
  .brands p { max-width: none; }
  .brand-list { flex: none; width: 100%; }
  .specs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .intro-top, .about-grid { grid-template-columns: minmax(0, 1fr); }
  .intro-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .works { grid-auto-rows: 240px; }
  .work, .work:nth-child(n) { grid-column: span 12; }
  .brand-list { justify-content: flex-start; }
  .portrait { max-width: 420px; order: -1; }
  .v-prev, .v-next { top: auto; bottom: max(54px, calc(env(safe-area-inset-bottom, 0px) + 44px)); transform: none; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } .marquee-track { animation: none; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="#inicio" data-t="marca"></a>
    <nav class="menu" aria-label="Secciones">
      <a href="#trabajos">Trabajos</a>
      <a href="#fotos">Fotos</a>
      <a href="#sobre-mi">Sobre mí</a>
    </nav>
    <a class="pill" href="#contacto"><span>Contacto</span><i aria-hidden="true">→</i></a>
  </div>
</header>

<main id="inicio">

  <div class="wrap">
    <div class="hero">
      <video id="hero-video" muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>
      <div class="hero-shade"></div>
      <div class="hero-body">
        <div class="hero-top">
          <div class="hero-title">
            <p class="hi" data-t="saludo"></p>
            <h1><span data-t="titulo1"></span><em data-t="titulo2"></em></h1>
          </div>
          <div class="hero-side">
            <p class="hero-lead" data-t="frase"></p>
            <p class="hero-sub" data-t="fraseSub"></p>
          </div>
        </div>
        <ol class="specs" id="specs"></ol>
      </div>
    </div>
  </div>

  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

  <div class="wrap">
    <div class="brands" id="brands">
      <p data-t="marcasTitulo"></p>
      <div class="brand-list" id="brand-list"></div>
    </div>
  </div>

  <section class="intro">
    <div class="wrap">
      <div class="intro-top">
        <div>
          <p class="eyebrow" data-t="introEtiqueta"></p>
          <h2 data-t="introTitulo"></h2>
        </div>
        <div>
          <p class="intro-text" data-t="introTexto"></p>
          <div class="intro-row">
            <span class="muted" data-t="introNota"></span>
            <a class="pill orange" href="#contacto"><span data-t="introBoton"></span><i aria-hidden="true">→</i></a>
          </div>
        </div>
      </div>
      <div class="intro-cards" id="intro-cards"></div>
    </div>
  </section>

  <section id="trabajos">
    <div class="wrap">
      <div class="head-center">
        <p class="eyebrow serif" data-t="trabajosEtiqueta"></p>
        <h2 data-t="trabajosTitulo"></h2>
      </div>
      <div class="works" id="works"></div>
    </div>
  </section>

  <section id="fotos">
    <div class="wrap">
      <div class="row-head">
        <div>
          <p class="eyebrow serif" data-t="fotosEtiqueta"></p>
          <h2 data-t="fotosTitulo"></h2>
        </div>
        <div class="arrows">
          <button class="arrow" type="button" id="t-prev" aria-label="Fotos anteriores">←</button>
          <button class="arrow" type="button" id="t-next" aria-label="Fotos siguientes">→</button>
        </div>
      </div>
      <div class="track" id="track"></div>
    </div>
  </section>

  <section class="about" id="sobre-mi">
    <div class="wrap">
      <div class="about-grid">
        <div>
          <p class="eyebrow" data-t="sobreEtiqueta"></p>
          <h2 data-t="sobreTitulo"></h2>
          <p class="body" data-t="sobreTexto1"></p>
          <p class="body" data-t="sobreTexto2"></p>
          <div class="facts" id="facts"></div>
        </div>
        <div class="portrait"><img id="portrait" alt="" loading="lazy" decoding="async"></div>
      </div>
    </div>
  </section>

  <section id="contacto">
    <div class="wrap">
      <div class="contact-card">
        <h2 data-t="contactoTitulo"></h2>
        <p data-t="contactoTexto"></p>
        <div class="contact-row">
          <a class="pill dark" data-ig href="#" target="_blank" rel="noopener"><span></span><i aria-hidden="true">→</i></a>
          <a class="pill" data-mail href="#"><span></span><i aria-hidden="true">→</i></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span data-t="marca"></span>
    <span data-t="copyright"></span>
  </div>
</footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Visor">
  <button class="v-btn v-close" type="button" id="v-close">Cerrar ×</button>
  <button class="v-btn v-prev" type="button" id="v-prev" aria-label="Anterior">←</button>
  <div class="stage" id="stage"></div>
  <button class="v-btn v-next" type="button" id="v-next" aria-label="Siguiente">→</button>
  <div class="v-info" id="v-info"></div>
</div>

<script>
/* ==========================================================================
   EDITA AQUÍ
   Todo lo que cambia (textos, enlaces, fotos y vídeos) está en este bloque.
   - Respeta las comillas "así" y las comas al final de cada línea.
   - Para poner una palabra en letra cursiva, ponla entre asteriscos: *así*
   ========================================================================== */
var SITE = {

  /* ---- Datos básicos ---- */
  marca: "ALEJANDRO",                    // esquina superior izquierda y pie de página
  copyright: "© 2026",
  instagram: "tuusuario",                // solo el usuario, sin @ ni https
  email: "tucorreo@ejemplo.com",

  /* ---- Portada ---- */
  portada: "videos/portada.mp4",         // clip de 5 a 10 s, 1080p, sin sonido
  portadaPoster: "images/poster-portada.jpg",
  saludo: "Hola, soy",
  titulo1: "Videógrafo",
  titulo2: "& fotógrafo",                // esta línea sale en cursiva
  frase: "Las mejores imágenes se sienten, no se explican.",
  fraseSub: "De la idea al montaje final, cuento historias que te dejan pensando.",
  especialidades: ["Vídeo de aventura", "Deporte y acción", "Fotografía", "Documental"],

  /* ---- Banda de texto en movimiento ---- */
  banda: ["Fotografía", "Vídeo", "Aventura", "Deporte"],

  /* ---- Marcas con las que has trabajado (déjalo vacío [] para ocultar la franja) ---- */

(function () {
  var S = SITE;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Texto con palabras en cursiva entre *asteriscos*, sin HTML */
  function rich(node, text) {
    node.textContent = '';
    String(text == null ? '' : text).split(/(\*[^*]+\*)/).forEach(function (p) {
      if (!p) return;
      if (p.length > 2 && p.charAt(0) === '*' && p.charAt(p.length - 1) === '*') {
        var m = document.createElement('em'); m.textContent = p.slice(1, -1); node.appendChild(m);
      } else { node.appendChild(document.createTextNode(p)); }
    });
  }
  function make(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) rich(e, text);
    return e;
  }

  /* Textos sueltos */
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (n) { rich(n, S[n.getAttribute('data-t')]); });

  /* Enlaces */
  var ig = String(S.instagram || '').replace(/^@/, '');
  Array.prototype.forEach.call(document.querySelectorAll('[data-ig]'), function (a) {
    a.href = 'https://www.instagram.com/' + ig + '/';
    a.querySelector('span').textContent = 'Instagram @' + ig;
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-mail]'), function (a) {
    a.href = 'mailto:' + S.email;
    a.querySelector('span').textContent = S.email;
  });
  document.title = S.marca + ' · Foto y vídeo';

  /* Portada */
  var hv = document.getElementById('hero-video');
  hv.poster = S.portadaPoster;
  hv.src = S.portada;
  if (reduce) { hv.removeAttribute('autoplay'); } else { var hp = hv.play(); if (hp && hp.catch) hp.catch(function () {}); }

  /* Especialidades */
  var specs = document.getElementById('specs');
  (S.especialidades || []).forEach(function (t, i) {
    var li = make('li'); li.appendChild(make('b', '', '#' + (i < 9 ? '0' : '') + (i + 1))); li.appendChild(document.createTextNode(t)); specs.appendChild(li);
  });

  /* Banda en movimiento (se repite para que el bucle no tenga saltos) */
  var mq = document.getElementById('marquee');
  for (var r = 0; r < 4; r++) (S.banda || []).forEach(function (t) { mq.appendChild(make('span', '', t)); });

  /* Marcas */
  var brands = document.getElementById('brands');
  if (S.marcas && S.marcas.length) {
    var bl = document.getElementById('brand-list');
    S.marcas.forEach(function (t) { bl.appendChild(make('span', '', t)); });
  } else { brands.hidden = true; }

  /* Fotos de la presentación */
  var ic = document.getElementById('intro-cards');
  (S.intro || []).forEach(function (p) {
    var im = document.createElement('img'); im.src = p.img; im.alt = p.alt || ''; im.loading = 'lazy'; im.decoding = 'async'; ic.appendChild(im);
  });

  /* Trabajos */
  var works = document.getElementById('works');
  (S.trabajos || []).forEach(function (t) {
    var b = make('button', 'work'); b.type = 'button';
    var v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('aria-hidden', 'true');
    if (t.poster) v.poster = t.poster;
    v.src = t.preview;
    b.appendChild(v);
    b.appendChild(make('span', 'work-play'));
    var cap = make('div', 'work-cap'); cap.appendChild(make('h3', '', t.titulo)); cap.appendChild(make('span', '', t.categoria)); b.appendChild(cap);
    b.addEventListener('click', function () { openVideo(t.completo, t.titulo, b); });
    works.appendChild(b);
  });

  /* Los clips arrancan al entrar en pantalla y se pausan al salir */
  var clips = works.querySelectorAll('video');
  if (!reduce && 'IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { var p = en.target.play(); if (p && p.catch) p.catch(function () {}); }
        else { en.target.pause(); }
      });
    }, { threshold: 0.35 });
    Array.prototype.forEach.call(clips, function (v) { io.observe(v); });
  }

  /* Carrusel de fotos */
  var track = document.getElementById('track');
  (S.fotos || []).forEach(function (f, i) {
    var c = make('button', 'card'); c.type = 'button';
    var box = make('div', 'card-img'); var im = document.createElement('img');
    im.src = f.img; im.alt = f.titulo || ''; im.loading = 'lazy'; im.decoding = 'async'; box.appendChild(im); c.appendChild(box);
    if (f.titulo) c.appendChild(make('h3', '', f.titulo));
    if (f.pie) c.appendChild(make('p', '', f.pie));
    c.addEventListener('click', function () { openPhoto(i, c); });
    track.appendChild(c);
  });
  document.getElementById('t-prev').addEventListener('click', function () { track.scrollBy({ left: -track.clientWidth * 0.8, behavior: reduce ? 'auto' : 'smooth' }); });
  document.getElementById('t-next').addEventListener('click', function () { track.scrollBy({ left: track.clientWidth * 0.8, behavior: reduce ? 'auto' : 'smooth' }); });

  /* Sobre mí */
  var por = document.getElementById('portrait'); por.src = S.retrato; por.alt = S.retratoAlt || '';
  Array.prototype.forEach.call(document.querySelectorAll('.about p.body'), function (p) { if (!p.textContent.trim()) p.hidden = true; });
  var facts = document.getElementById('facts');
  if (S.datos && S.datos.length) {
    S.datos.forEach(function (d) { var x = make('div'); x.appendChild(make('b', '', d.n)); x.appendChild(make('span', '', d.t)); facts.appendChild(x); });
  } else { facts.hidden = true; }

  /* Visor de fotos y vídeos */
  var viewer = document.getElementById('viewer'), stage = document.getElementById('stage'), info = document.getElementById('v-info');
  var prev = document.getElementById('v-prev'), next = document.getElementById('v-next');
  var cur = -1, opener = null;
  function clearStage() { var v = stage.querySelector('video'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); } stage.textContent = ''; }
  function showPhoto(i) {
    var n = S.fotos.length; cur = (i + n) % n; clearStage();
    var im = document.createElement('img'); im.src = S.fotos[cur].img; im.alt = S.fotos[cur].titulo || ''; stage.appendChild(im);
    info.textContent = (S.fotos[cur].titulo ? S.fotos[cur].titulo + ' · ' : '') + (cur + 1) + ' / ' + n;
  }
  function openPhoto(i, el) { opener = el; prev.hidden = next.hidden = false; showPhoto(i); viewer.hidden = false; document.getElementById('v-close').focus(); }
  function openVideo(src, title, el) {
    opener = el; cur = -1; prev.hidden = next.hidden = true; clearStage();
    var v = document.createElement('video'); v.controls = true; v.autoplay = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.src = src;
    stage.appendChild(v); var p = v.play(); if (p && p.catch) p.catch(function () {});
    info.textContent = title || ''; viewer.hidden = false; document.getElementById('v-close').focus();
  }
  function closeViewer() { clearStage(); viewer.hidden = true; cur = -1; if (opener) opener.focus(); }
  document.getElementById('v-close').addEventListener('click', closeViewer);
  prev.addEventListener('click', function () { showPhoto(cur - 1); });
  next.addEventListener('click', function () { showPhoto(cur + 1); });
  viewer.addEventListener('click', function (e) { if (e.target === viewer || e.target === stage) closeViewer(); });
  document.addEventListener('keydown', function (e) {
    if (viewer.hidden) return;
    if (e.key === 'Escape') closeViewer();
    else if (cur > -1 && e.key === 'ArrowLeft') showPhoto(cur - 1);
    else if (cur > -1 && e.key === 'ArrowRight') showPhoto(cur + 1);
  });
  var x0 = null;
  stage.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (x0 === null || cur < 0) return;
    var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) showPhoto(cur + (dx < 0 ? 1 : -1)); x0 = null;
  });
})();
</script>
